name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Type-check frontend
        run: npm run lint
      - name: Type-check serverless API
        run: npx tsc -p api/tsconfig.json
      - name: Run repository smoke checks
        run: npm run check:smoke
      - name: Build
        run: npm run build
